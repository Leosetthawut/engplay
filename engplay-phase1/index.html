<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0e1324">
<title>EngPlay · เกมฝึกภาษาอังกฤษ 3 ระดับ</title>
<style>
:root{
  --bg:#0e1324; --bg2:#151c33; --card:#1b2340; --card2:#222c4f;
  --line:#2c3761; --txt:#eef1fb; --dim:#9aa5cc;
  --brand:#5b8cff; --brand2:#7c5cff; --ok:#2fd27a; --bad:#ff5c7a; --warn:#ffc24b;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:radial-gradient(1200px 600px at 50% -10%,#1d2850 0%,var(--bg) 55%) fixed;
  color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Sukhumvit Set","Noto Sans Thai","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  font-size:16px;line-height:1.5;
  overscroll-behavior:none;
}
#app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 10px) 14px calc(env(safe-area-inset-bottom) + 86px);}
h1,h2,h3{margin:0;line-height:1.3}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.hide{display:none !important}

/* ---------- shared bits ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.dim{color:var(--dim)}
.sm{font-size:13px}
.xs{font-size:12px}
.big{font-size:26px;font-weight:800;letter-spacing:-.4px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line);
  border-radius:999px;padding:5px 11px;font-size:12.5px;color:var(--dim);white-space:nowrap}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-weight:700;
  border-radius:14px;padding:15px 16px;min-height:52px;box-shadow:0 8px 20px -10px var(--brand)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--card2);border:1px solid var(--line);box-shadow:none;font-weight:600}
.btn.sm2{min-height:44px;padding:11px 14px;font-size:14px;border-radius:12px}
.bar{height:8px;border-radius:99px;background:#0d1328;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--ok));transition:width .5s}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ---------- bottom nav ---------- */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(14,19,36,.92);
  backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding:6px 0 calc(env(safe-area-inset-bottom) + 6px)}
#nav .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
#nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;color:var(--dim);font-size:11px;font-weight:600}
#nav button.on{color:var(--brand)}
#nav svg{width:23px;height:23px}

/* ---------- home ---------- */
.hero{display:flex;align-items:center;gap:12px;margin:6px 2px 14px}
.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--brand),var(--brand2));
  display:grid;place-items:center;font-weight:900;font-size:19px;color:#fff}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 8px;text-align:center}
.stat b{display:block;font-size:19px;letter-spacing:-.3px}
.lv{margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:14px;position:relative;overflow:hidden}
.lv.locked{opacity:.55}
.lv .tag{position:absolute;top:0;right:0;font-size:11px;padding:4px 10px;border-bottom-left-radius:10px;
  background:var(--card2);color:var(--dim)}
.lv h3{font-size:16.5px}
.units{display:flex;flex-direction:column;gap:7px;margin-top:12px}
.unit{display:flex;align-items:center;gap:10px;background:var(--card2);border:1px solid var(--line);
  border-radius:13px;padding:11px 12px;width:100%;text-align:left}
.unit .ub{flex:1;min-width:0}
.unit .ub div:first-child{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ring{width:38px;height:38px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:10.5px;font-weight:700}

/* ---------- quiz ---------- */
#qTop{display:flex;align-items:center;gap:10px;margin:4px 0 12px}
#qBar{flex:1;height:9px;border-radius:99px;background:#0d1328;overflow:hidden}
#qBar>i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--ok));width:0;transition:width .3s}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px;text-align:center}
.qlabel{font-size:12px;color:var(--dim);letter-spacing:.4px;text-transform:uppercase;margin-bottom:10px}
.qword{font-size:30px;font-weight:800;letter-spacing:-.5px;word-break:break-word}
.qword.th{font-size:26px}
.qsent{font-size:19px;font-weight:600;line-height:1.6}
.qsent u{color:var(--brand);text-decoration:none;border-bottom:2px dashed var(--brand);padding:0 14px}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.opt{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--line);
  border-radius:14px;padding:14px;min-height:54px;text-align:left;font-size:16px;font-weight:600;transition:.15s}
.opt .n{width:24px;height:24px;flex:none;border-radius:7px;background:var(--card2);display:grid;place-items:center;
  font-size:12px;color:var(--dim);font-weight:700}
.opt.ok{border-color:var(--ok);background:rgba(47,210,122,.14)}
.opt.bad{border-color:var(--bad);background:rgba(255,92,122,.14)}
.opt.dis{opacity:.45}
/* scramble */
.slot{min-height:64px;border:1.5px dashed var(--line);border-radius:14px;padding:9px;display:flex;
  flex-wrap:wrap;gap:7px;align-content:flex-start;margin-top:14px}
.pool{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.chip{background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:9px 12px;font-size:15px;font-weight:600}
.chip.used{opacity:.25}
.chip.ok{border-color:var(--ok);background:rgba(47,210,122,.16)}
.chip.bad{border-color:var(--bad);background:rgba(255,92,122,.16)}
#fb{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--bg2);border-top:1px solid var(--line);
  padding:14px 14px calc(env(safe-area-inset-bottom) + 14px);transform:translateY(110%);transition:.25s}
#fb.show{transform:none}
#fb .in{max-width:520px;margin:0 auto}
#fbTitle{font-weight:800;font-size:17px;display:flex;align-items:center;gap:8px}
#fbTitle.ok{color:var(--ok)} #fbTitle.bad{color:var(--bad)}

/* ---------- result / stats ---------- */
.mini{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:12px}
.chart{display:flex;align-items:flex-end;gap:7px;height:110px;margin-top:14px}
.chart>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%}
.chart i{display:block;width:100%;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,var(--brand),var(--brand2));min-height:3px}
.listrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.listrow:last-child{border-bottom:0}
.fade{animation:fade .28s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:90;background:var(--card2);
  border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-size:14px;font-weight:600;
  box-shadow:0 10px 30px -10px #000}
</style>
</head>
<body>
<div id="app"></div>

<div id="fb"><div class="in">
  <div id="fbTitle"></div>
  <div id="fbBody" class="sm dim" style="margin:6px 0 12px"></div>
  <button class="btn" id="fbNext">ถัดไป</button>
</div></div>

<nav id="nav"><div class="in">
  <button data-go="home" class="on">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 3l9 7.5V21H3z"/></svg>เล่น</button>
  <button data-go="stats">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>ผลลัพธ์</button>
  <button data-go="chat">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>โค้ช AI</button>
  <button data-go="words">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16M4 12h16M4 19h10"/></svg>คลังคำ</button>
</div></nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

var KEY="engplay_v1";
var S=null;
function fresh(){return{v:2,items:{},xp:0,ans:0,cor:0,n:0,days:{},last:"",streak:0,best:0,
  unlocked:1,modes:{},placed:false,sessions:0,ok:{},gerr:{},wr:{c:0,t:0},daily:"",ai:true,cust:[]};}
function load(){try{var r=localStorage.getItem(KEY);S=r?JSON.parse(r):fresh();}catch(e){S=fresh();}
  var f=fresh();for(var k in f)if(S[k]===undefined)S[k]=f[k];}
var cloudClient=null,authUser=null,cloudTimer=null,cloudHydrating=false,cloudStatus="ยังไม่ได้เชื่อมต่อ";
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  if(authUser&&!cloudHydrating&&cloudClient){
    cloudStatus="กำลังบันทึก...";
    clearTimeout(cloudTimer);
    cloudTimer=setTimeout(pushCloud,900);
  }
}
function cloudConfigured(){return !!(window.ENGPLAY_CONFIG&&window.ENGPLAY_CONFIG.SUPABASE_URL&&window.ENGPLAY_CONFIG.SUPABASE_ANON_KEY&&window.ENGPLAY_CONFIG.SUPABASE_URL.indexOf("YOUR_")<0);}
function initCloud(){
  if(!window.supabase||!cloudConfigured()){cloudStatus="ยังไม่ได้ตั้งค่า Supabase";return;}
  cloudClient=window.supabase.createClient(window.ENGPLAY_CONFIG.SUPABASE_URL,window.ENGPLAY_CONFIG.SUPABASE_ANON_KEY);
  cloudClient.auth.onAuthStateChange(function(event,session){
    if(event==="INITIAL_SESSION"||event==="SIGNED_IN"||event==="TOKEN_REFRESHED"||event==="SIGNED_OUT"){
      setTimeout(function(){handleAuthSession(session);},0);
    }
  });
}
async function handleAuthSession(session){
  var previousUserId=authUser&&authUser.id;
  authUser=session&&session.user?session.user:null;
  if(previousUserId!==(authUser&&authUser.id)){
    CH.msgs=[];CH.topic="";CH.sessionId=null;CH.loaded=false;CH.busy=false;
  }
  if(!authUser){cloudStatus="ยังไม่ได้เข้าสู่ระบบ";if(view==="chat"||document.getElementById("accountBox"))render();return;}
  cloudStatus="กำลังโหลดข้อมูลจาก Cloud...";
  try{
    var result=await cloudClient.from("user_progress").select("payload,updated_at").eq("user_id",authUser.id).maybeSingle();
    if(result.error)throw result.error;
    if(result.data&&result.data.payload){
      cloudHydrating=true;S=Object.assign(fresh(),result.data.payload);applyCustom();
      try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
      cloudHydrating=false;cloudStatus="ซิงก์ข้อมูลล่าสุดแล้ว";
    }else{
      cloudStatus="กำลังย้ายข้อมูลเดิมขึ้น Cloud...";await pushCloud();
    }
  }catch(e){cloudHydrating=false;cloudStatus="ซิงก์ไม่สำเร็จ: "+(e.message||"ตรวจสอบการตั้งค่า");console.error("EngPlay cloud sync",e);}
  if(view==="chat"||document.getElementById("accountBox"))render();
}
async function pushCloud(){
  if(!authUser||!cloudClient||cloudHydrating)return;
  try{
    var result=await cloudClient.from("user_progress").upsert({user_id:authUser.id,payload:S,updated_at:new Date().toISOString()},{onConflict:"user_id"});
    if(result.error)throw result.error;
    cloudStatus="บันทึกบน Cloud แล้ว · "+new Date().toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"});
  }catch(e){cloudStatus="บันทึก Cloud ไม่สำเร็จ";console.error("EngPlay cloud save",e);}
  var box=document.getElementById("cloudStatus");if(box)box.textContent=cloudStatus;
}
function accountHTML(){
  var signed=!!authUser;

function showAuthModal(mode){
  var old=document.getElementById("epAuthModal");if(old)old.remove();
  var d=document.createElement("div");d.id="epAuthModal";d.style.cssText="position:fixed;inset:0;z-index:120;background:rgba(5,8,18,.82);display:flex;align-items:center;justify-content:center;padding:20px";
  d.innerHTML='<div class="card" style="width:100%;max-width:390px"><div class="row"><b style="font-size:18px;flex:1">'+(mode==="signup"?"สมัครสมาชิก EngPlay":"เข้าสู่ระบบ EngPlay")+'</b><button class="pill" id="epAuthClose">ปิด</button></div>'+ 
    '<div class="sm dim" style="margin:8px 0 14px">'+(mode==="signup"?"สร้างบัญชีเพื่อบันทึกความก้าวหน้าของคุณ":"เข้าสู่ระบบเพื่อโหลดข้อมูลการเรียนของคุณ")+'</div>'+ 
    '<label class="sm">อีเมล</label><input id="epEmail" type="email" autocomplete="email" placeholder="you@example.com" style="width:100%;margin:5px 0 12px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--txt)">'+
    '<label class="sm">รหัสผ่าน (อย่างน้อย 6 ตัวอักษร)</label><input id="epPassword" type="password" autocomplete="'+(mode==="signup"?"new-password":"current-password")+'" placeholder="รหัสผ่าน" style="width:100%;margin:5px 0 12px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--txt)">'+
    '<div id="epAuthMsg" class="xs dim" style="min-height:20px;margin-bottom:8px"></div><button class="btn" id="epAuthSubmit">'+(mode==="signup"?"สมัครสมาชิก":"เข้าสู่ระบบ")+'</button>'+
    '<button class="btn ghost sm2" id="epAuthSwitch" style="margin-top:8px">'+(mode==="signup"?"มีบัญชีแล้ว? เข้าสู่ระบบ":"ยังไม่มีบัญชี? สมัครสมาชิก")+'</button></div>';
  document.body.appendChild(d);
  d.querySelector("#epAuthClose").onclick=function(){d.remove();};
  d.querySelector("#epAuthSwitch").onclick=function(){showAuthModal(mode==="signup"?"login":"signup");};
  d.onclick=function(e){if(e.target===d)d.remove();};
  d.querySelector("#epAuthSubmit").onclick=async function(){
    var email=d.querySelector("#epEmail").value.trim(),password=d.querySelector("#epPassword").value,msg=d.querySelector("#epAuthMsg"),btn=d.querySelector("#epAuthSubmit");
    if(!email||!password){msg.textContent="กรุณากรอกอีเมลและรหัสผ่าน";return;}
    if(password.length<6){msg.textContent="รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร";return;}
    btn.disabled=true;msg.textContent="กำลังดำเนินการ...";
    var res=mode==="signup"?await cloudClient.auth.signUp({email:email,password:password}):await cloudClient.auth.signInWithPassword({email:email,password:password});
    btn.disabled=false;
    if(res.error){msg.textContent=res.error.message;return;}
    if(mode==="signup"&&!res.data.session){msg.textContent="สมัครสำเร็จ กรุณาตรวจอีเมลเพื่อยืนยันบัญชีก่อนเข้าสู่ระบบ";return;}
    d.remove();
  };
}
function bindAccount(){
  var a=document.getElementById("epSignIn"),b=document.getElementById("epSignUp"),o=document.getElementById("epSignOut");
  if(a)a.onclick=function(){if(!cloudClient){toast("กรุณาตั้งค่า Supabase ก่อน");return;}showAuthModal("login");};
  if(b)b.onclick=function(){if(!cloudClient){toast("กรุณาตั้งค่า Supabase ก่อน");return;}showAuthModal("signup");};
  if(o)o.onclick=async function(){await cloudClient.auth.signOut();toast("ออกจากระบบแล้ว");};
}
function today(){var d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}
function dayKey(off){var d=new Date();d.setDate(d.getDate()-off);return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}
function touchDay(){
  var t=today();
  if(S.last!==t){
    var y=dayKey(1);
    S.streak=(S.last===y)?S.streak+1:1;
    if(S.streak>S.best)S.best=S.streak;
    S.last=t;
  }
  S.days[t]=(S.days[t]||0)+1;
  var keep={};for(var i=0;i<14;i++){var k=dayKey(i);if(S.days[k])keep[k]=S.days[k];}
  S.days=keep;
}

function allItems(lv){var o=[];BANK.forEach(function(L){if(lv&&L.lv!==lv)return;
  L.units.forEach(function(U,ui){U.items.forEach(function(it){
    o.push({en:it.en,th:it.th,s:it.s,t:it.t,lv:L.lv,ui:ui,un:U.name,key:L.lv+"|"+it.en});});});});return o;}
var ALL=allItems();
function st(k){return S.items[k]||(S.items[k]={b:0,d:0,c:0,w:0});}
function mastered(k){var x=S.items[k];return x&&x.b>=3;}
function lvProgress(lv){var a=allItems(lv),m=0;a.forEach(function(i){if(mastered(i.key))m++;});
  return{m:m,total:a.length,pct:Math.round(m/a.length*100)};}
function unitProgress(lv,ui){var a=allItems(lv).filter(function(i){return i.ui===ui;}),m=0,seen=0;
  a.forEach(function(i){if(mastered(i.key))m++;if(S.items[i.key])seen++;});
  return{m:m,total:a.length,seen:seen,pct:Math.round(m/a.length*100)};}
function unlockedLv(){
  var u=S.unlocked;
  if(u<2&&lvProgress(1).pct>=50)u=2;
  if(u<3&&u>=2&&lvProgress(2).pct>=50)u=3;
  if(u!==S.unlocked){S.unlocked=u;save();}
  return u;
}
function genProgress(){var seen=0,m=0;GEN.forEach(function(g){var x=S.items["g|"+g.id];
  if(x){seen++;if(x.b>=3)m++;}});return{seen:seen,m:m};}
function dueCount(lv){var n=0;allItems(lv).forEach(function(i){var x=S.items[i.key];
  if(x&&x.b<5&&x.d<=S.n)n++;});return n;}

var $=function(s,r){return (r||document).querySelector(s);};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function pick(a,n){return shuffle(a).slice(0,n);}

function ringSVG(pct){
  var r=16,c=2*Math.PI*r,off=c*(1-pct/100);
  return '<div class="ring"><svg width="38" height="38" viewBox="0 0 38 38">'+
  '<circle cx="19" cy="19" r="16" fill="none" stroke="#2c3761" stroke-width="4"/>'+
  '<circle cx="19" cy="19" r="16" fill="none" stroke="'+(pct>=100?"#2fd27a":"#5b8cff")+'" stroke-width="4" '+
  'stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'"/></svg>'+
  '<span>'+pct+'%</span></div>';
}

function rxEsc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");}
function padDis(ans,d){
  var extra=[ans+"s",ans+"ed",ans+"ing","to "+ans,"will "+ans,ans+"es"];
  d=uniq(d.filter(function(x){return x&&x!==ans;}));
  for(var i=0;i<extra.length&&d.length<3;i++)if(d.indexOf(extra[i])<0&&extra[i]!==ans)d.push(extra[i]);
  return d.slice(0,3);
}
function genQ(r,write){
  var item=genItem(r);
  r.d=padDis(r.a,r.d||[]);
  if(write)return{item:item,mode:"write",answer:r.e,
    prompt:{type:"write",text:r.t,h:r.h,tip:r.tip,name:r.n}};
  var holed=r.e.replace(new RegExp("\\b"+rxEsc(r.a)+"\\b"),"___");
  if(holed===r.e)holed=r.e.replace(r.a,"___");
  return{item:item,mode:"gblank",answer:r.a,
    prompt:{type:"gsent",text:holed,th:r.t,tip:r.tip,name:r.n},
    options:shuffle([r.a].concat(r.d))};
}

/* ================= 3c. ตัวตรวจไวยากรณ์ของโหมดเขียนประโยค ================= */
var ART={a:1,an:1,the:1},BE={am:1,is:1,are:1,was:1,were:1,be:1,been:1,being:1},
    AUX={do:1,does:1,did:1,have:1,has:1,had:1,will:1,would:1,can:1,could:1,should:1,must:1,might:1},
    PREP={"in":1,"on":1,"at":1,"to":1,"for":1,"with":1,"by":1,"from":1,"of":1,"about":1,"after":1,"before":1,"near":1,"than":1};
/* กริยาอปกติที่พบบ่อย เพื่อให้คำแนะนำตรงจุดขึ้น */
var IRREG=[["go","goes","went","gone","going"],["see","sees","saw","seen","seeing"],
 ["take","takes","took","taken","taking"],["come","comes","came","come","coming"],
 ["get","gets","got","gotten","getting"],["make","makes","made","made","making"],
 ["say","says","said","said","saying"],["know","knows","knew","known","knowing"],
 ["think","thinks","thought","thought","thinking"],["give","gives","gave","given","giving"],
 ["drink","drinks","drank","drunk","drinking"],["sleep","sleeps","slept","slept","sleeping"],
 ["understand","understands","understood","understood","understanding"],

 ["leave","leaves","left","left","leaving"],["bring","brings","brought","brought","bringing"],
 ["cost","costs","cost","cost","costing"],["keep","keeps","kept","kept","keeping"],

var VFORM={};
IRREG.forEach(function(r){var v={b:r[0],s:r[1],p:r[2],pp:r[3],g:r[4]};
  ["b","s","p","pp","g"].forEach(function(k){var w=v[k];
    if(!VFORM[w])VFORM[w]=[];VFORM[w].push({v:v,k:k});});});
VERB.forEach(function(v){[["b","b"],["s","s"],["p","p"],["pp","pp"],["g","g"]].forEach(function(k){
  var w=v[k[0]];if(!VFORM[w])VFORM[w]=[];VFORM[w].push({v:v,k:k[1]});});});
var FORMTIP={b:"ตรงนี้ต้องใช้กริยารูปธรรมดา (หลัง do/does/did/will/to ไม่ผัน)",
  s:"ประธานเอกพจน์ (he/she/it) ต้องเติม -s/-es ที่กริยา",
  p:"ประโยคนี้เป็นอดีต ต้องใช้กริยาช่อง 2",
  pp:"หลัง have/has/was/were ต้องใช้กริยาช่อง 3",
  g:"หลัง is/am/are ต้องใช้ V-ing"};
var CONTR=[["do not","don't"],["does not","doesn't"],["did not","didn't"],["cannot","can't"],["can not","can't"],
 ["will not","won't"],["is not","isn't"],["are not","aren't"],["was not","wasn't"],["were not","weren't"],
 ["have not","haven't"],["has not","hasn't"],["i am","i'm"],["i will","i'll"],["i have","i've"],["it is","it's"],
 ["we will","we'll"],["they will","they'll"],["she will","she'll"],["he will","he'll"],["you will","you'll"],
 ["we have","we've"],["they have","they've"],["there is","there's"]];
function norm(s){return String(s).toLowerCase().replace(/[’']/g,"").replace(/[.,!?;:"-]/g," ")
  .replace(/\s+/g," ").trim();}
function tok(s){return norm(s).split(" ").filter(Boolean);}
function variants(t){
  var n=norm(t),out=[n];
  CONTR.forEach(function(c){
    var a=norm(c[0]),b=norm(c[1]); /* norm ตัด ' ออก: do not <-> dont */
    if(n.indexOf(a)>=0)out.push(n.split(a).join(b));
    if(n.indexOf(b)>=0)out.push(n.split(b).join(a));});
  return uniq(out);
}
function lev(a,b){
  var m=a.length,n=b.length,d=[],i,j;
  for(i=0;i<=m;i++){d[i]=[i];}
  for(j=0;j<=n;j++)d[0][j]=j;
  for(i=1;i<=m;i++)for(j=1;j<=n;j++)
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[m][n];
}
function align(u,t){ /* u=ของผู้ใช้ t=เฉลย -> รายการ op */
  var m=u.length,n=t.length,d=[],i,j;
  for(i=0;i<=m;i++){d[i]=[];for(j=0;j<=n;j++)d[i][j]=0;}
  for(i=0;i<=m;i++)d[i][0]=i;
  for(j=0;j<=n;j++)d[0][j]=j;
  for(i=1;i<=m;i++)for(j=1;j<=n;j++)
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(u[i-1]===t[j-1]?0:1));
  var ops=[];i=m;j=n;
  while(i>0||j>0){
    if(i>0&&j>0&&d[i][j]===d[i-1][j-1]+(u[i-1]===t[j-1]?0:1)){
      ops.unshift(u[i-1]===t[j-1]?{o:"same",u:u[i-1],t:t[j-1]}:{o:"sub",u:u[i-1],t:t[j-1]});i--;j--;}
    else if(i>0&&d[i][j]===d[i-1][j]+1){ops.unshift({o:"extra",u:u[i-1]});i--;}
    else {ops.unshift({o:"miss",t:t[j-1]});j--;}
  }
  return ops;
}
function sameVerb(a,b){
  if(!VFORM[a]||!VFORM[b])return null;
  for(var i=0;i<VFORM[a].length;i++)for(var j=0;j<VFORM[b].length;j++)
    if(VFORM[a][i].v===VFORM[b][j].v)return VFORM[b][j].k;
  return null;
}
function checkWriting(raw,target,accepted){
  var u=norm(raw),res={tips:[],types:[],ops:[],answer:target};
  if(!u){res.verdict="wrong";res.tips.push("ยังไม่ได้พิมพ์คำตอบ");return res;}
  var acc=variants(target).concat(accepted||[]);
  if(acc.indexOf(u)>=0){
    res.verdict="ok";
    if(!/^[A-Z]/.test(String(raw).trim()))res.tips.push("เนื้อหาถูกหมดแล้ว · ประโยคอังกฤษขึ้นต้นด้วยตัวพิมพ์ใหญ่เสมอ");
    else if(!/[.?!]$/.test(String(raw).trim()))res.tips.push("เนื้อหาถูกหมดแล้ว · อย่าลืมเครื่องหมายท้ายประโยค");
    return res;
  }
  var ut=tok(u),tt=tok(target);
  res.ops=align(ut,tt);
  if(ut.slice().sort().join(" ")===tt.slice().sort().join(" ")){
    res.verdict="order";res.types.push("order");
    res.tips.push("คำครบถูกหมดแล้ว แต่ลำดับยังไม่ถูก — ภาษาอังกฤษเรียง ประธาน + กริยา + กรรม + เวลา/สถานที่");
    return res;
  }
  var errs=0;
  res.ops.forEach(function(op){
    if(op.o==="same")return;
    errs++;
    if(op.o==="sub"){
      var k=sameVerb(op.u,op.t);
      if(ART[op.u]&&ART[op.t]){res.types.push("article");
        res.tips.push(op.t==="the"?"ตรงนี้ใช้ the (สิ่งที่รู้กันว่าหมายถึงอันไหน) ไม่ใช่ "+op.u
          :"ใช้ “"+op.t+"” — an ใช้หน้าคำที่ขึ้นต้นด้วยเสียงสระ (a, e, i, o, u) นอกนั้นใช้ a");}
      else if(k){res.types.push("verbform");res.tips.push("“"+op.u+"” → “"+op.t+"” : "+FORMTIP[k]);}
      else if(BE[op.u]&&BE[op.t]){res.types.push("be");
        res.tips.push("“"+op.u+"” → “"+op.t+"” : is/am/are ต้องตรงกับประธาน และอดีตใช้ was/were");}
      else if(AUX[op.u]&&AUX[op.t]){res.types.push("aux");
        res.tips.push("กริยาช่วยควรเป็น “"+op.t+"” ไม่ใช่ “"+op.u+"”");}
      else if(PREP[op.u]&&PREP[op.t]){res.types.push("prep");
        res.tips.push("บุพบทควรเป็น “"+op.t+"” — in ใช้กับเดือน/ปี/ในสถานที่ · on ใช้กับวัน/พื้นผิว · at ใช้กับเวลาและจุดที่เจาะจง");}
      else if(op.u+"s"===op.t||op.u+"es"===op.t){res.types.push("plural");
        res.tips.push("ต้องเติม s เป็น “"+op.t+"” (ประธานเอกพจน์ he/she/it หรือคำนามพหูพจน์)");}
      else if(op.t+"s"===op.u||op.t+"es"===op.u){res.types.push("plural");
        res.tips.push("ตรงนี้ไม่ต้องเติม s : ใช้ “"+op.t+"”");}
      else if(op.u+"ed"===op.t||op.u+"d"===op.t){res.types.push("verbform");
        res.tips.push("ประโยคนี้เป็นอดีต ต้องผันเป็น “"+op.t+"”");}
      else if(op.t+"ed"===op.u||op.t+"d"===op.u){res.types.push("verbform");
        res.tips.push("ตรงนี้ไม่ต้องผันอดีต ใช้ “"+op.t+"”");}
      else if(op.u+"ing"===op.t){res.types.push("verbform");
        res.tips.push("หลัง is/am/are ต้องใช้ V-ing : “"+op.t+"”");}
      else if(op.t+"ing"===op.u){res.types.push("verbform");
        res.tips.push("ตรงนี้ไม่ใช้ V-ing ใช้ “"+op.t+"”");}
      else if(lev(op.u,op.t)<=2){res.types.push("spelling");
        res.tips.push("สะกดผิดเล็กน้อย: “"+op.u+"” → “"+op.t+"”");}
      else{res.types.push("word");res.tips.push("ตรงนี้ควรใช้ “"+op.t+"” แทน “"+op.u+"”");}
    }else if(op.o==="miss"){
      if(ART[op.t]){res.types.push("article");res.tips.push("ขาด article “"+op.t+"” หน้าคำนาม");}
      else if(BE[op.t]){res.types.push("be");res.tips.push("ขาดกริยา be “"+op.t+"” — ประโยคอังกฤษต้องมีกริยาเสมอ");}
      else if(AUX[op.t]){res.types.push("aux");res.tips.push("ขาดกริยาช่วย “"+op.t+"”");}
      else if(PREP[op.t]){res.types.push("prep");res.tips.push("ขาดบุพบท “"+op.t+"”");}
      else{res.types.push("missing");res.tips.push("ขาดคำว่า “"+op.t+"”");}
    }else{res.types.push("extra");res.tips.push("มีคำเกินมา: “"+op.u+"”");}
  });
  res.verdict=errs<=1?"close":"wrong";
  if(res.tips.length>3)res.tips=res.tips.slice(0,3).concat(["(ดูประโยคเฉลยด้านบนประกอบ)"]);
  return res;
}
var ERRTH={article:"a / an / the",verbform:"รูปกริยา (ช่อง 1-2-3, -ing)",be:"กริยา be (is/am/are/was)",
  aux:"กริยาช่วย (do/does/did/will)",prep:"บุพบท (in/on/at)",plural:"การเติม s",
  spelling:"การสะกดคำ",order:"ลำดับคำในประโยค",missing:"คำที่หายไป",extra:"คำที่เกินมา",word:"เลือกคำผิด"};

var AICFG={mode:"proxy",url:"/api/ai"};
var AI={st:"off",cool:0,last:""};
function aiSync(){AI.st=cloudConfigured()?"on":"off";}
aiSync();
function aiReady(){return AI.st==="on"&&S.ai!==false&&!!authUser&&Date.now()>AI.cool;}

function aiCall(prompt,tier,noGuard){
  if(!noGuard&&!aiReady()){
    AI.last=!authUser?"กรุณาเข้าสู่ระบบก่อนใช้ AI":(S.ai===false?"AI ถูกปิดชั่วคราว":"AI ยังไม่พร้อมใช้งาน");
    return Promise.resolve(null);
  }
  if(!authUser){AI.last="กรุณาเข้าสู่ระบบก่อนทดสอบ AI";return Promise.resolve(null);}
  return cloudClient.auth.getSession().then(function(sessionResult){
    var session=sessionResult&&sessionResult.data&&sessionResult.data.session;
    if(!session||!session.access_token){AI.last="Session หมดอายุ กรุณาเข้าสู่ระบบใหม่";return null;}
    return fetch("/api/ai",{method:"POST",headers:{
      "content-type":"application/json","authorization":"Bearer "+session.access_token
    },body:JSON.stringify({prompt:String(prompt||""),tier:tier==="default"?"default":"quick"})});
  }).then(function(r){
    if(!r)return null;
    return r.json().then(function(j){
      if(!r.ok){
        AI.last=(j&&j.error)?String(j.error):"AI API ตอบกลับรหัส "+r.status;
        if(r.status===401||r.status===403)AI.cool=Date.now()+30000;
        if(r.status===429)AI.cool=Date.now()+60000;
        return null;
      }
      AI.last="";
      return j&&typeof j.text==="string"?j.text:null;
    });
  }).catch(function(e){
    AI.last="เชื่อมต่อ AI ไม่สำเร็จ: "+(e&&e.message?e.message:"ตรวจสอบอินเทอร์เน็ต");
    return null;
  });
}
function aiJSON(prompt,tier){
  return aiCall(prompt,tier).then(function(t){
    if(!t)return null;
    var m=String(t).match(/\{[\s\S]*\}|\[[\s\S]*\]/);
    try{return m?JSON.parse(m[0]):null;}catch(e){AI.last="AI ส่งข้อมูลไม่อยู่ในรูปแบบที่อ่านได้";return null;}
  });
}
function aiText(prompt,onText,tier){
  return aiCall(prompt,tier).then(function(t){if(t&&onText)onText({text:t});return t;});
}
function aiTest(el){
  el.textContent="กำลังทดสอบ OpenAI API...";
  var save=AI.cool;AI.cool=0;
  return aiCall("ตอบกลับคำว่า OK เพียงคำเดียว", "quick", true).then(function(t){
    if(t){AI.last="";aiSync();el.innerHTML='<span style="color:var(--ok)">✓ เชื่อมต่อสำเร็จ — โมเดลตอบว่า: '+
      esc(String(t).slice(0,40))+'</span>';}
    else{AI.cool=save;el.innerHTML='<span style="color:var(--bad)">✕ ไม่สำเร็จ: '+esc(AI.last||"ไม่ทราบสาเหตุ")+'</span>';}
  });
}

/* ------------------------------ 5. ตัวเกม ------------------------------- */
var Q=null;
var IV=[1,4,10,25,60,9999]; /* ช่วงทบทวนตามกล่อง Leitner */

function buildMode(item,box,isPlacement){
  var pool;
  if(isPlacement)pool=["mc1","blank"];
  else if(box===0)pool=["mc1","mc1","mc2"];
  else if(box===1)pool=["mc2","blank","mc1"];
  else if(box===2)pool=["mc2","blank","order"];
  else if(box===3)pool=["blank","order","mc2"];
  else pool=["write","blank","order"];
  if(!item.s)pool=pool.filter(function(m){return m!=="blank"&&m!=="order";});
  return pool[Math.floor(Math.random()*pool.length)];
}

function makeQ(item,mode){
  var sameLv=allItems(item.lv);
  var others=sameLv.filter(function(i){return i.en!==item.en;});
  var q={item:item,mode:mode};
  if(mode==="mc1"){
    q.prompt={type:"word",text:item.en};
    q.options=shuffle([item.th].concat(pick(others,3).map(function(i){return i.th;})));
    q.answer=item.th;
  }else if(mode==="mc2"){
    q.prompt={type:"th",text:item.th};
    q.options=shuffle([item.en].concat(pick(others,3).map(function(i){return i.en;})));
    q.answer=item.en;
  }else if(mode==="blank"){
    q.prompt={type:"sent",text:item.s,th:item.t};
    q.options=shuffle([item.en].concat(pick(others,3).map(function(i){return i.en;})));
    q.answer=item.en;
  }else if(mode==="write"){
    q.prompt={type:"write",text:item.t,h:[item.en],tip:"ใช้คำว่า "+item.en,name:item.un};
    q.answer=item.s.replace("___",item.en);
  }else{
    q.prompt={type:"order",text:item.t};
    q.words=item.s.replace("___",item.en).replace(/[.?]$/,"").split(" ");
    q.answer=q.words.join(" ");
    q.pool=shuffle(q.words);
  }
  return q;
}

function selectItems(opt,count){
  var pool;
  if(opt.weak){
    pool=ALL.filter(function(i){var x=S.items[i.key];return x&&x.w>0;});
    if(pool.length<count)pool=pool.concat(ALL.filter(function(i){return S.items[i.key];}));
  }else{
    pool=opt.lv?allItems(opt.lv):allItems(0).filter(function(i){return i.lv<=unlockedLv();});
    if(opt.ui!==undefined&&opt.ui>=0)pool=pool.filter(function(i){return i.ui===opt.ui;});
  }
  var due=[],newer=[],rest=[];
  pool.forEach(function(i){var x=S.items[i.key];
    if(!x)newer.push(i);
    else if(x.b<5&&x.d<=S.n)due.push(i);
    else rest.push(i);});
  due.sort(function(a,b){return S.items[a.key].b-S.items[b.key].b;});
  var out=due.slice(0,Math.ceil(count*0.6));
  out=out.concat(shuffle(newer).slice(0,count-out.length));
  if(out.length<count)out=out.concat(shuffle(due.slice(out.length)).slice(0,count-out.length));
  if(out.length<count)out=out.concat(shuffle(rest).slice(0,count-out.length));
  return shuffle(out).slice(0,count);
}

function start(opt){
  var items=selectItems(opt,10);
  if(!items.length){toast("ยังไม่มีคำในชุดนี้");return;}
  Q={list:items.map(function(it){var b=(S.items[it.key]||{b:0}).b;return makeQ(it,buildMode(it,b));}),
     i:0,cor:0,xp:0,run:0,miss:[],mastered:[],t0:Date.now(),placement:false,opt:opt};
  go("quiz");drawQ();
}

/* โหมดไวยากรณ์ไม่รู้จบ / เขียนประโยค */
function startGen(write){
  var list=[];
  for(var i=0;i<10;i++){
    if(write&&i%3===2){ /* สลับประโยคจากคลังคำจริงเข้ามาด้วย */
      var pool=ALL.filter(function(it){return it.lv<=unlockedLv()&&it.s;});
      var it=rp(pool);
      list.push({item:it,mode:"write",answer:it.s.replace("___",it.en),
        prompt:{type:"write",text:it.t,h:[it.en],tip:"ประโยคจากคลังคำศัพท์ของคุณ",name:it.un}});
    }else list.push(genQ(genOne(0),write));
  }
  Q={list:list,i:0,cor:0,xp:0,run:0,miss:[],mastered:[],t0:Date.now(),placement:false,
     opt:{gen:true,write:write}};
  go("quiz");drawQ();
}
/* ชุดประจำวัน: สุ่มด้วยเมล็ดจากวันที่ ทุกคนได้ชุดเดิมทั้งวัน แล้วเปลี่ยนเองพรุ่งนี้ */
function startDaily(){
  var keep=RND;RND=mulberry32(seedFrom(today()));
  var list=[],curated=selectItems({lv:0,ui:-1},4);
  curated.forEach(function(it){var b=(S.items[it.key]||{b:0}).b;list.push(makeQ(it,buildMode(it,b)));});
  for(var i=0;i<4;i++)list.push(genQ(genOne(0),false));
  for(var j=0;j<2;j++)list.push(genQ(genOne(0),true));
  RND=keep;
  Q={list:shuffle(list),i:0,cor:0,xp:0,run:0,miss:[],mastered:[],t0:Date.now(),placement:false,
     opt:{daily:true}};
  go("quiz");drawQ();
}

  var mix=[];
  [1,2,3].forEach(function(lv){mix=mix.concat(pick(allItems(lv),4));});

function wireOrder(q){
  var chosen=[];
  function paint(){
    $("#slot").innerHTML=chosen.map(function(w,i){return '<button class="chip" data-r="'+i+'">'+esc(w)+'</button>';}).join("");
    $("#pool").innerHTML=q.pool.map(function(w,i){
      return '<button class="chip'+(used(i)?" used":"")+'" data-a="'+i+'">'+esc(w)+'</button>';}).join("");
    var c=$("#chk");c.disabled=chosen.length!==q.words.length;c.style.opacity=c.disabled?.5:1;
    $("#slot").querySelectorAll("[data-r]").forEach(function(b){b.onclick=function(){
      var i=+b.dataset.r;usedIdx.splice(i,1);chosen.splice(i,1);paint();};});
    $("#pool").querySelectorAll("[data-a]").forEach(function(b){b.onclick=function(){
      var i=+b.dataset.a;if(used(i))return;usedIdx.push(i);chosen.push(q.pool[i]);paint();};});
  }
  var usedIdx=[];
  function used(i){return usedIdx.indexOf(i)>=0;}
  paint();
  $("#chk").onclick=function(){answer(q,chosen.join(" "));};
}

function answer(q,val,btn){
  var ok=val.replace(/\s+/g," ").trim().toLowerCase()===q.answer.toLowerCase();
  var it=q.item,x=st(it.key);

  if(Q.placement){
    Q.byLv[it.lv]+=ok?1:0;
  }
  S.ans++;S.n++;
  if(ok)S.cor++;
  var ms=S.modes[q.mode]||(S.modes[q.mode]={c:0,t:0});ms.t++;if(ok)ms.c++;

  var wasMastered=x.b>=3;
  if(ok){x.c++;x.b=Math.min(5,x.b+1);x.d=S.n+IV[x.b-1];Q.cor++;Q.run++;
    var gain=10+(Q.run>=3?5:0);Q.xp+=gain;S.xp+=gain;
    if(!wasMastered&&x.b>=3)Q.mastered.push(it);
  }else{x.w++;x.b=Math.max(0,x.b-1);x.d=S.n+1;Q.run=0;Q.miss.push({it:it,given:val,mode:q.mode});}
  touchDay();save();

  if(btn){
    document.querySelectorAll(".opt").forEach(function(b){
      b.classList.add("dis");
      if(b.dataset.o===q.answer){b.classList.remove("dis");b.classList.add("ok");}
    });
    if(!ok)btn.classList.remove("dis"),btn.classList.add("bad");
  }else{
    document.querySelectorAll("#slot .chip").forEach(function(b){b.classList.add(ok?"ok":"bad");});
  }

  var ft=$("#fbTitle"),fbb=$("#fbBody");
  ft.className=ok?"ok":"bad";
  ft.textContent=ok?("ถูกต้อง  +"+(10+(Q.run>=3?5:0))+" XP"):"ยังไม่ถูก";
  var body;
  if(it.gen){body='<div style="color:var(--txt);font-size:16px">'+esc(it.en)+'</div>'+esc(it.th)+
    '<div class="xs" style="margin-top:8px">💡 '+esc(it.tip)+'</div>';}
  else{body='<b style="color:var(--txt)">'+esc(it.en)+'</b> = '+esc(it.th);
  if(it.s)body+='<br><span style="color:var(--txt)">'+esc(it.s.replace("___",it.en))+'</span><br>'+esc(it.t);}
  if(!ok&&q.mode==="order")body='คำตอบที่ถูก: <b style="color:var(--txt)">'+esc(q.answer)+'</b><br>'+esc(it.t);
  fbb.innerHTML=body;
  if(!ok)aiMoreBtn(q,fbb,val);
  $("#fb").classList.add("show");
  $("#fbNext").textContent=(Q.i+1>=Q.list.length)?"ดูผลสรุป":"ถัดไป";
  $("#fbNext").onclick=next;
}

function answerWrite(q,raw,skipped){
  var it=q.item,x=st(it.key),key=norm(q.answer);
  var r=skipped?{verdict:"wrong",tips:["กดดูเฉลย — ลองอ่านประโยคเฉลยออกเสียงหนึ่งรอบก่อนไปต่อ"],types:[],ops:[]}
    :checkWriting(raw,q.answer,S.ok[key]||[]);
  var ok=r.verdict==="ok",half=(r.verdict==="close"||r.verdict==="order");

  S.ans++;S.n++;S.wr.t++;
  if(ok){S.cor++;S.wr.c++;}
  var ms=S.modes.write||(S.modes.write={c:0,t:0});ms.t++;if(ok)ms.c++;
  r.types.forEach(function(t){S.gerr[t]=(S.gerr[t]||0)+1;});

  var wasM=x.b>=3,gain=0;
  if(ok){x.c++;x.b=Math.min(5,x.b+1);x.d=S.n+IV[x.b-1];Q.cor++;Q.run++;gain=12+(Q.run>=3?5:0);
    if(!wasM&&x.b>=3)Q.mastered.push(it);}
  else if(half){x.d=S.n+2;Q.run=0;gain=6;Q.miss.push({it:it,given:raw,mode:"write"});}
  else{x.w++;x.b=Math.max(0,x.b-1);x.d=S.n+1;Q.run=0;Q.miss.push({it:it,given:raw,mode:"write"});}
  Q.xp+=gain;S.xp+=gain;
  touchDay();save();

  var ft=$("#fbTitle"),fbb=$("#fbBody");
  ft.className=ok?"ok":(half?"":"bad");
  if(!ok&&half)ft.style.color="var(--warn)";else ft.style.color="";
  ft.textContent=ok?("ถูกต้อง  +"+gain+" XP"):half?("เกือบถูกแล้ว  +"+gain+" XP"):"ยังไม่ถูก";

  var body='<div style="color:var(--txt);font-size:16px;margin-bottom:6px">'+esc(q.answer)+'</div>'+
    '<div style="margin-bottom:8px">'+esc(it.th||it.t)+'</div>';
  if(!ok&&!skipped&&r.ops.length)
    body+='<div style="background:#0d1328;border-radius:10px;padding:10px;margin-bottom:8px;color:var(--dim)">'+
      diffHTML(r.ops)+'</div>';
  if(r.tips.length)body+='<div style="color:var(--txt)">• '+r.tips.map(esc).join('<br>• ')+'</div>';
  if(it.tip)body+='<div class="xs" style="margin-top:8px">💡 '+esc(it.tip)+'</div>';
  if(!ok&&!skipped&&norm(raw))
    body+='<button class="btn ghost sm2" id="acceptMine" style="margin-top:12px">'+
      'คำตอบของฉันก็ถูกเหมือนกัน · นับว่าถูก</button>';
  fbb.innerHTML=body;

  function markOk(note){
    if(!S.ok[key])S.ok[key]=[];
    if(norm(raw)&&S.ok[key].indexOf(norm(raw))<0)S.ok[key].push(norm(raw));
    S.cor++;S.wr.c++;ms.c++;x.c++;x.b=Math.min(5,x.b+1);x.d=S.n+IV[x.b-1];
    S.xp+=12;Q.xp+=12;Q.cor++;
    Q.miss=Q.miss.filter(function(m){return m.it!==it;});
    save();
    var a=$("#acceptMine");if(a)a.outerHTML='<div class="xs" style="margin-top:10px;color:var(--ok)">'+note+'</div>';
    var t=$("#fbTitle");if(t){t.className="ok";t.style.color="";t.textContent="นับว่าถูก  +12 XP";}
  }
  var am=$("#acceptMine");
  if(am)am.onclick=function(){markOk("✓ จำไว้แล้ว ครั้งหน้าประโยคนี้จะนับว่าถูก");};

  /* ให้ AI ตรวจทานซ้ำเมื่อระบบกฎบอกว่ายังไม่ถูก — แก้กรณีตอบถูกแต่ใช้คำต่างจากเฉลย */
  if(!ok&&!skipped&&norm(raw)&&aiReady()){
    var tok2=Q.i+"/"+Q.list.length;
    fbb.insertAdjacentHTML("beforeend",
      '<div id="aiBox" class="xs" style="margin-top:10px;color:var(--brand)">🤖 กำลังให้ AI ตรวจทานอีกรอบ...</div>');
    aiCheckSentence(it.th||it.t,q.answer,raw).then(function(r){
      var box=$("#aiBox");
      if(!box||tok2!==Q.i+"/"+Q.list.length)return;
      if(!r){box.remove();return;}
      if(r.ok){box.innerHTML='<b style="color:var(--ok)">🤖 AI บอกว่าประโยคของคุณใช้ได้</b><br>'+
        esc(r.th||"")+(r.better?'<br>สำนวนที่เป็นธรรมชาติ: '+esc(r.better):"");
        markOk("✓ AI ยืนยันแล้ว ครั้งหน้าประโยคนี้จะนับว่าถูก");}
      else box.innerHTML='<b style="color:var(--brand)">🤖 AI อธิบายเพิ่ม</b><br>'+esc(r.th||"")+
        (r.better?'<br>ลองแบบนี้: <span style="color:var(--txt)">'+esc(r.better)+'</span>':"");
    });
  }
  aiMoreBtn(q,fbb,raw);

  $("#fb").classList.add("show");
  $("#fbNext").textContent=(Q.i+1>=Q.list.length)?"ดูผลสรุป":"ถัดไป";
  $("#fbNext").onclick=next;
}

function next(){
  $("#fb").classList.remove("show");
  Q.i++;
  if(Q.i>=Q.list.length)finish();else drawQ();
}

function finish(){
  var secs=Math.round((Date.now()-Q.t0)/1000);
  var pct=Math.round(Q.cor/Q.list.length*100);
  if(!Q.placement)S.sessions++;
  if(Q.opt&&Q.opt.daily)S.daily=today();

  if(Q.placement){
    var lv=1;
    if(Q.byLv[3]>=3)lv=3;else if(Q.byLv[2]>=3)lv=2;else if(Q.byLv[1]>=3)lv=2;
    if(Q.byLv[2]>=2&&Q.byLv[3]>=2)lv=3;

  }
  save();

  var h='<div style="text-align:center;margin:18px 0 6px"><div class="big" style="font-size:52px">'+

    '<h1 style="font-size:22px;margin-top:8px">'+(Q.placement?"ผลวัดระดับ":"จบรอบแล้ว")+'</h1>'+
    '<div class="sm dim">ใช้เวลา '+Math.floor(secs/60)+" นาที "+(secs%60)+' วินาที</div></div>';

  h+='<div class="mini">'+
    '<div class="stat"><b>'+Q.cor+'/'+Q.list.length+'</b><span class="xs dim">ตอบถูก</span></div>'+
    '<div class="stat"><b>'+pct+'%</b><span class="xs dim">ความแม่นรอบนี้</span></div>'+
    '<div class="stat"><b>+'+Q.xp+'</b><span class="xs dim">XP ที่ได้</span></div>'+
    '<div class="stat"><b>'+S.streak+' วัน</b><span class="xs dim">เล่นต่อเนื่อง</span></div></div>';

  if(Q.placement){
    h+='<div class="card" style="margin-top:12px;border-color:var(--brand)"><b>ระดับที่แนะนำ: '+
      BANK[S.unlocked-1].name+'</b><div class="sm dim" style="margin-top:4px">'+
      'ตอบถูก — ระดับ 1: '+Q.byLv[1]+'/4 · ระดับ 2: '+Q.byLv[2]+'/4 · ระดับ 3: '+Q.byLv[3]+'/4<br>'+
      'ปลดล็อกถึงระดับ '+S.unlocked+' ให้แล้ว เริ่มจากบทแรกของระดับนี้ได้เลย</div></div>';
  }

  if(Q.mastered.length){
    h+='<div class="card" style="margin-top:12px"><b style="color:var(--ok)">✓ คำที่เลื่อนเป็น “จำได้แล้ว” '+
      Q.mastered.length+' คำ</b><div class="sm dim" style="margin-top:6px">'+
      Q.mastered.map(function(i){return esc(i.en);}).join(" · ")+'</div></div>';
  }

  if(Q.miss.length){
    h+='<div class="card" style="margin-top:12px"><b>ทบทวนข้อที่พลาด ('+Q.miss.length+')</b>'+
      '<div style="margin-top:4px">';
    Q.miss.forEach(function(m){
      h+='<div class="listrow" style="width:100%;text-align:left">'+
        '<div style="flex:1;min-width:0"><b>'+esc(m.it.en)+'</b>'+
        '<div class="xs dim">'+esc(m.it.th)+'</div></div></div>';});
    h+='</div><div class="xs dim" style="margin-top:10px">คำเหล่านี้จะถูกนำกลับมาถามในรอบถัดไปอัตโนมัติ</div></div>';
  }else if(!Q.placement){
    h+='<div class="card" style="margin-top:12px"><b style="color:var(--ok)">ไม่พลาดเลยทั้งรอบ</b>'+
      '<div class="sm dim">ระบบจะยืดเวลาทบทวนคำเหล่านี้ออกไป เพื่อให้คุณได้เจอคำใหม่มากขึ้น</div></div>';
  }

  h+='<button class="btn" id="again" style="margin-top:16px">เล่นอีกรอบ 10 ข้อ</button>'+
     '<button class="btn ghost sm2" id="home" style="margin-top:10px">กลับหน้าแรก</button>'+
     '<button class="btn ghost sm2" id="toStats" style="margin-top:10px">ดูผลลัพธ์รวม</button>';

  var a=$("#app");a.innerHTML=h;a.className="fade";

  $("#nav").classList.remove("hide");
  $("#again").onclick=function(){
    if(Q.placement)start({lv:S.unlocked,ui:-1});
    else if(Q.opt&&Q.opt.daily)startGen(false);
    else if(Q.opt&&Q.opt.gen)startGen(Q.opt.write);
    else start(Q.opt);};
  $("#home").onclick=function(){go("home");};

var CH={msgs:[],topic:"",busy:false,sessionId:null,loaded:false};
function newChatSessionId(){
  return (window.crypto&&crypto.randomUUID)?crypto.randomUUID():
    ("xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,function(c){
      var r=Math.random()*16|0;return(c==="x"?r:(r&3|8)).toString(16);
    }));
}
async function loadChatHistory(){
  if(CH.loaded||!authUser||!cloudClient)return;
  CH.loaded=true;
  try{
    var latest=await cloudClient.from("ai_chat_messages").select("session_id")
      .eq("user_id",authUser.id).order("created_at",{ascending:false}).limit(1).maybeSingle();
    if(latest.error)throw latest.error;
    if(!latest.data)return;
    CH.sessionId=latest.data.session_id;
    var rows=await cloudClient.from("ai_chat_messages")
      .select("role,content,metadata,created_at").eq("user_id",authUser.id)
      .eq("session_id",CH.sessionId).order("created_at",{ascending:true}).limit(60);
    if(rows.error)throw rows.error;
    CH.msgs=(rows.data||[]).map(function(m){
      var meta=m.metadata||{};
      if(m.role==="user")return{r:"u",t:m.content};
      return{r:"c",t:m.content,tth:meta.tth||"",fix:meta.fix||"",th:meta.th||""};
    });
    var last=(rows.data||[]).slice(-1)[0];
    if(last&&last.metadata&&last.metadata.topic)CH.topic=last.metadata.topic;
  }catch(e){console.error("EngPlay chat history",e);}
  if(view==="chat")render();
}
async function saveChatMessage(role,content,metadata){
  if(!authUser||!cloudClient||!CH.sessionId)return;
  var res=await cloudClient.from("ai_chat_messages").insert({
    user_id:authUser.id,session_id:CH.sessionId,role:role,content:content,
    metadata:metadata||{}
  });
  if(res.error)console.error("EngPlay save chat",res.error);
}

function chatBind(){

function chatTurn(userText){
  if(CH.busy)return;
  if(userText!==null&&!String(userText).trim())return;
  var lvName=["ง่ายมาก (ประโยคสั้น)","ระดับกลาง","ระดับสูง ใช้สำนวนได้"][unlockedLv()-1];
  if(!CH.sessionId)CH.sessionId=newChatSessionId();
  if(userText!==null){
    CH.msgs.push({r:"u",t:userText.trim()});S.ans++;S.n++;
    saveChatMessage("user",userText.trim(),{topic:CH.topic});
  }
  CH.busy=true;render();
  var list=$("#chList");
  if(list)list.insertAdjacentHTML("beforeend",'<div class="xs dim" id="chWait" style="margin:8px 0">โค้ชกำลังพิมพ์...</div>');
  window.scrollTo(0,document.body.scrollHeight);

  var hist=CH.msgs.map(function(m){return (m.r==="u"?"ผู้เรียน: ":"โค้ช: ")+m.t;}).join("\n");
  var p=AIROLE+"\nคุณกำลังฝึกสนทนาภาษาอังกฤษกับผู้เรียน หัวข้อ: "+CH.topic+
    "\nระดับผู้เรียน: "+lvName+" — ใช้ภาษาอังกฤษให้เหมาะกับระดับนี้ ประโยคสั้น ชัดเจน\n"+
    (hist?"บทสนทนาที่ผ่านมา:\n"+hist+"\n":"เริ่มบทสนทนาเป็นคนแรก\n")+
    "\nตอบเป็น JSON เท่านั้น: {"+
    '"fix":"ประโยคภาษาอังกฤษที่ถูกต้องของผู้เรียน ถ้าผู้เรียนเขียนถูกอยู่แล้วหรือยังไม่ได้พูดให้ใส่ค่าว่าง",'+
    '"th":"คำแนะนำภาษาไทยสั้นมาก 1 ประโยค บอกว่าแก้อะไรหรือชมถ้าถูก",'+
    '"reply":"ประโยคภาษาอังกฤษที่คุณตอบกลับ ลงท้ายด้วยคำถามใหม่ 1 คำถามเสมอ ไม่เกิน 2 ประโยค",'+
    '"tth":"คำแปลไทยของ reply"}';
  aiJSON(p,"default").then(function(r){
    CH.busy=false;
    if(!r||!r.reply){CH.msgs.push({r:"c",t:"Sorry, I cannot reply right now. Please try again.",
      tth:"ตอนนี้โค้ชตอบไม่ได้ ลองกดส่งใหม่อีกครั้ง"});render();return;}
    if(userText!==null){
      var good=!r.fix||norm(r.fix)===norm(userText);
      if(good){S.cor++;S.xp+=8;}else S.xp+=4;
      var cs=S.modes.chat||(S.modes.chat={c:0,t:0});cs.t++;if(good)cs.c++;
      touchDay();

    var assistantMsg={r:"c",t:r.reply,tth:r.tth,
      fix:(userText!==null&&r.fix&&norm(r.fix)!==norm(userText))?r.fix:"",
      th:(userText!==null?r.th:"")};
    CH.msgs.push(assistantMsg);
    saveChatMessage("assistant",r.reply,{topic:CH.topic,tth:assistantMsg.tth,
      fix:assistantMsg.fix,th:assistantMsg.th});
    save();render();
    setTimeout(function(){window.scrollTo(0,document.body.scrollHeight);
      var i=$("#chIn");if(i)try{i.focus();}catch(e){}},80);
  });
}

function aiMakeLesson(topic,lv,statusEl){

  var p=AIROLE+"\n\nสร้างบทเรียนคำศัพท์ภาษาอังกฤษใหม่ 8 คำ สำหรับผู้เรียนชาวไทย"+
    "\nระดับ: "+["ผู้เริ่มต้น (A1)","ระดับกลาง (A2-B1)","ระดับสูง (B1-B2)"][lv-1]+
    "\nหัวข้อที่ผู้เรียนขอ: "+(topic||"ชีวิตประจำวันทั่วไป")+
    (weak.length?"\nจุดที่ผู้เรียนมักผิด ให้แทรกประโยคที่ได้ฝึกเรื่องนี้: "+weak.slice(0,4).join(", "):"")+
    "\nห้ามซ้ำกับคำเหล่านี้: "+known+
    "\n\nตอบเป็น JSON เท่านั้น ห้ามมีข้อความอื่น:\n"+
    '{"name":"ชื่อบทภาษาไทยสั้น ๆ","tip":"เคล็ดไวยากรณ์ภาษาไทย 1 ประโยค",'+
    '"items":[{"en":"คำอังกฤษ","th":"คำแปลไทย","s":"ประโยคตัวอย่างที่มี ___ แทนตำแหน่งของคำนั้น","t":"คำแปลไทยของประโยค"}]}'+
    "\nกติกา: ประโยค s ต้องมี ___ หนึ่งจุดเสมอ ความยาว 5-10 คำ และต้องไม่มีคำตอบปรากฏซ้ำในประโยค";
  return aiJSON(p,"default").then(function(r){
    if(!r||!r.items){statusEl.textContent="สร้างไม่สำเร็จ ลองกดใหม่อีกครั้ง";return null;}
    var items=r.items.filter(function(i){return i&&i.en&&i.th&&i.s&&i.t&&i.s.indexOf("___")>=0;})
      .map(function(i){return{en:String(i.en).trim(),th:String(i.th).trim(),s:String(i.s).trim(),t:String(i.t).trim()};});
    if(items.length<4){statusEl.textContent="ผลลัพธ์ไม่สมบูรณ์ ลองกดใหม่อีกครั้ง";return null;}
    if(!S.cust)S.cust=[];
    S.cust.push({name:(r.name||topic||"บทใหม่")+" (AI)",tip:r.tip||"บทนี้สร้างโดย AI ตามหัวข้อที่คุณขอ",
      lv:lv,items:items,at:today()});
    save();applyCustom();
    statusEl.textContent="✓ เพิ่มบทใหม่ "+items.length+" คำเรียบร้อย";
    setTimeout(function(){render();},700);
    return items;
  });
}

document.addEventListener("keydown",function(e){
  if(view!=="quiz")return;
  if(e.target&&e.target.tagName==="INPUT")return;
  if($("#fb").classList.contains("show")&&(e.key==="Enter"||e.key===" ")){e.preventDefault();next();return;}
  var n=parseInt(e.key,10);
  if(n>=1&&n<=4){var b=document.querySelectorAll(".opt")[n-1];if(b)b.click();}
});
